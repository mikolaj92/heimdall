[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heimdall"
version = "0.1.0"
description = "CEO gateway. Small Unix atoms; observe-queue, dual-label-ready, dual-label-pass."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mikolaj" }]
dependencies = []

[project.scripts]
observe-queue = "heimdall.observe_queue:main"
dual-label-ready = "heimdall.dual_label_ready:main"
dual-label-pass = "heimdall.dual_label_pass:main"

[dependency-groups]
dev = [
  "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/heimdall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
