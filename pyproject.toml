[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heimdall"
version = "0.1.0"
description = "CEO gateway. Small Unix atoms; observe-queue, dual-label-ready, dual-label-pass, observe-verdict, observe-outbound, observe-blocked, observe-influenzer, observe-inbound, observe-cleared, craft-ready, ready-apply, craft-inbound, inbound-close, verdict-apply, out-apply, influenzer-handoff, sync-labels, auto-label-issue, advance-work-labels."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mikolaj" }]
dependencies = []

[project.scripts]
observe-queue = "heimdall.observe_queue:main"
dual-label-ready = "heimdall.dual_label_ready:main"
dual-label-pass = "heimdall.dual_label_pass:main"
observe-verdict = "heimdall.observe_verdict:main"
observe-outbound = "heimdall.observe_outbound:main"
observe-blocked = "heimdall.observe_blocked:main"
observe-influenzer = "heimdall.observe_influenzer:main"
observe-inbound = "heimdall.observe_inbound:main"
observe-cleared = "heimdall.observe_cleared:main"
craft-ready = "heimdall.craft_ready:main"
ready-apply = "heimdall.ready_apply:main"
craft-inbound = "heimdall.craft_inbound:main"
inbound-close = "heimdall.inbound_close:main"
verdict-apply = "heimdall.verdict_apply:main"
out-apply = "heimdall.out_apply:main"
influenzer-handoff = "heimdall.influenzer_handoff:main"
sync-labels = "heimdall.sync_labels:main"
auto-label-issue = "heimdall.auto_label_issue:main"
advance-work-labels = "heimdall.advance_work_labels:main"

[dependency-groups]
dev = [
  "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/heimdall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
