version = "2"
id = "heimdall"
title = "Heimdall monitor"
description = "Parent monitors the GitHub bus, closes the mill dual-label gap, lists open PRs for QA, lists outbound that must not ship yet, lists stuck blocked issues, watches Influenzer's GitHub, lists Heimdall inbound not yet handed to Lokay, then lists outbound that may ship. Not a Fala host — the Mojo correlator in mikolaj92/Fala conducts this package. Does not wake tick or mill."
tags = ["heimdall", "monitor"]

[[impulse_types]]
id = "github.bus"
title = "GitHub coordination bus tick"
media_types = ["application/json"]
value_schema = { type = "object" }

[[reaction_kinds]]
id = "github.observe"
title = "Read-only GitHub bus envelope"
media_types = ["application/json"]

[[reaction_kinds]]
id = "github.dual_label"
title = "Catalog work:ready dual-label pass"
media_types = ["application/json"]

[[reaction_kinds]]
id = "github.observe_verdict"
title = "Read-only open PRs for Heimdall QA/verdict"
media_types = ["application/json"]

[[reaction_kinds]]
id = "github.observe_outbound"
title = "Read-only outbound items that must not ship yet"
media_types = ["application/json"]

[[reaction_kinds]]
id = "github.observe_blocked"
title = "Read-only stuck blocked issues"
media_types = ["application/json"]

[[reaction_kinds]]
id = "github.observe_influenzer"
title = "Read-only Influenzer GitHub items"
media_types = ["application/json"]

[[reaction_kinds]]
id = "github.observe_inbound"
title = "Read-only Heimdall inbound triage queue"
media_types = ["application/json"]

[[reaction_kinds]]
id = "github.observe_cleared"
title = "Read-only outbound items that may ship"
media_types = ["application/json"]

[[capabilities]]
id = "observe_queue"
title = "Read GitHub coordination bus; does not apply labels or wake the mill"
accepts_impulse_types = ["github.bus"]
emits_reaction_kinds = ["github.observe"]

[[capabilities]]
id = "dual_label_pass"
title = "Apply mill ai:ready on catalog work:ready; no-op on heimdall; does not wake the mill"
accepts_reaction_kinds = ["github.observe"]
emits_reaction_kinds = ["github.dual_label"]

[[capabilities]]
id = "observe_verdict"
title = "Read open PRs for QA/verdict; does not merge, comment, label, or wake the mill"
accepts_reaction_kinds = ["github.dual_label"]
emits_reaction_kinds = ["github.observe_verdict"]

[[capabilities]]
id = "observe_outbound"
title = "Read outbound that must not ship yet; does not merge, comment, label, wake the mill, or call Influenzer"
accepts_reaction_kinds = ["github.observe_verdict"]
emits_reaction_kinds = ["github.observe_outbound"]

[[capabilities]]
id = "observe_blocked"
title = "Read stuck blocked issues; does not merge, comment, label, wake the mill, or mail"
accepts_reaction_kinds = ["github.observe_outbound"]
emits_reaction_kinds = ["github.observe_blocked"]

[[capabilities]]
id = "observe_influenzer"
title = "Read Influenzer GitHub; does not merge, comment, label, wake tick, mill, SSH, or mail"
accepts_reaction_kinds = ["github.observe_blocked"]
emits_reaction_kinds = ["github.observe_influenzer"]

[[capabilities]]
id = "observe_inbound"
title = "Read Heimdall inbound triage queue; does not apply work:ready, wake mill, SSH, or mail"
accepts_reaction_kinds = ["github.observe_influenzer"]
emits_reaction_kinds = ["github.observe_inbound"]

[[capabilities]]
id = "observe_cleared"
title = "Read outbound that may ship; does not merge, comment, label, wake the mill, or call Influenzer"
accepts_reaction_kinds = ["github.observe_inbound"]
emits_reaction_kinds = ["github.observe_cleared"]

[[correlation_paths]]
id = "monitor"
title = "Observe bus, close dual-label gap, observe PRs for verdict, outbound that must not ship, stuck blocked issues, Influenzer GitHub, Heimdall inbound triage, then outbound that may ship"
description = "Fala conducts observe-queue, dual-label-pass, observe-verdict, observe-outbound, observe-blocked, observe-influenzer, observe-inbound, then observe-cleared. Dual-label-pass surveys catalog itself (subprocess adapters do not pipe stdout). Mill autonomy stays mill."

[[correlation_paths.effectors]]
id = "observe"
capability = "observe_queue"
adapter = { kind = "subprocess", command = ["uv", "run", "observe-queue"], cwd = "." }

[[correlation_paths.effectors]]
id = "dual_label"
capability = "dual_label_pass"
conduction = ["observe"]
adapter = { kind = "subprocess", command = ["uv", "run", "dual-label-pass"], cwd = "." }

[[correlation_paths.effectors]]
id = "observe_verdict"
capability = "observe_verdict"
conduction = ["dual_label"]
adapter = { kind = "subprocess", command = ["uv", "run", "observe-verdict"], cwd = "." }

[[correlation_paths.effectors]]
id = "observe_outbound"
capability = "observe_outbound"
conduction = ["observe_verdict"]
adapter = { kind = "subprocess", command = ["uv", "run", "observe-outbound"], cwd = "." }

[[correlation_paths.effectors]]
id = "observe_blocked"
capability = "observe_blocked"
conduction = ["observe_outbound"]
adapter = { kind = "subprocess", command = ["uv", "run", "observe-blocked"], cwd = "." }

[[correlation_paths.effectors]]
id = "observe_influenzer"
capability = "observe_influenzer"
conduction = ["observe_blocked"]
adapter = { kind = "subprocess", command = ["uv", "run", "observe-influenzer"], cwd = "." }

[[correlation_paths.effectors]]
id = "observe_inbound"
capability = "observe_inbound"
conduction = ["observe_influenzer"]
adapter = { kind = "subprocess", command = ["uv", "run", "observe-inbound"], cwd = "." }

[[correlation_paths.effectors]]
id = "observe_cleared"
capability = "observe_cleared"
conduction = ["observe_inbound"]
adapter = { kind = "subprocess", command = ["uv", "run", "observe-cleared"], cwd = "." }

# Fala-owned journal. Effectors never open this file.
[runtime.backend]
kind = "sqlite"
path = "runtime.db"

[runtime.reaction_store]
kind = "filesystem"
root = "artifacts/fala-reactions"
