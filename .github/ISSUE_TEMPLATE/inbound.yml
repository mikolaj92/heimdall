name: Inbound
description: Triage a signal. Not a Lokay handoff.
labels: ["bifrost:in", "verdict:hold"]
body:
  - type: markdown
    attributes:
      value: |
        Heimdall triage starts with `bifrost:in` and `verdict:hold`. Dropdowns apply taxonomy labels; noise forces rejection without `work:*`. Other work requires ISSUE_CRAFT.md.
  - type: dropdown
    id: source
    attributes:
      label: Source
      description: Where the signal came from.
      options:
        - "source:github"
        - "source:x"
        - "source:bluesky"
        - "source:mastodon"
        - "source:linkedin"
        - "source:other"
    validations:
      required: true
  - type: dropdown
    id: signal
    attributes:
      label: Signal kind
      description: What this inbound is.
      options:
        - "signal:feedback"
        - "signal:bug"
        - "signal:feature"
        - "signal:question"
        - "signal:praise"
        - "signal:noise"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Signal
      description: Short summary plus original quoted or linked. Not a Lokay spec.
      placeholder: Who / what / link …
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: Fit check
      description: In repo / product scope? Which `owner/name` if it became work? Out of scope → `verdict:reject`, no `work:*`.
      placeholder: In scope for … / out of scope because …
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: Proposed verdict
      description: Replaces the current verdict automatically, including `verdict:hold`; never applies `work:ready`.
      options:
        - "verdict:hold"
        - "verdict:pass"
        - "verdict:reject"
        - "verdict:needs-scout"
      default: 0
    validations:
      required: true
  - type: checkboxes
    id: triage_ok
    attributes:
      label: Gate
      options:
        - label: Not handing to Lokay. No `work:ready` until the craft contract is complete.
          required: true
