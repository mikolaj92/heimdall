name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.0
      - name: Install locked dependencies
        run: uv sync --frozen --all-extras
      - name: Run atom contract tests
        run: uv run --frozen pytest -q
