name: Sync labels

on:
  push:
    branches: [main]
    paths:
      - labels.yml
      - src/heimdall/sync_labels.py
      - .github/workflows/sync-labels.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.0
      - name: Apply labels.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run sync-labels --prune --repo "${GITHUB_REPOSITORY}"
