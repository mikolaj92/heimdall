name: Sync labels

on:
  push:
    branches: [main]
    paths:
      - labels.yml
      - scripts/sync-labels.py
      - .github/workflows/sync-labels.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply labels.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync-labels.py --prune --repo "${GITHUB_REPOSITORY}"
