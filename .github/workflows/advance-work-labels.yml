name: Advance work labels

on:
  pull_request:
    types: [opened, closed]

concurrency:
  group: work-queue-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  label:
    if: github.event.action == 'opened' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.0
      - name: Advance work:* from PR links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run advance-work-labels
